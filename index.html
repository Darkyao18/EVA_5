<g stroke="#466385" stroke-width="3" stroke-linejoin="round"><path d="M171 90c-12-52 129-52 117 0" fill="none" stroke-width="${b.straps==='wide'?12:6}" stroke="#537fb6"/><path d="M148 102c-52-3-50 123 6 127m153-127c52-3 50 123-6 127" fill="none" stroke="#779fd0" stroke-width="${b.straps==='wide'?18:8}"/>
<rect x="137" y="70" width="180" height="177" rx="42" fill="${mat}"/>${b.material==='cloth'?'<rect x="137" y="70" width="180" height="177" rx="42" fill="url(#bag-fabric)" stroke="none"/>':''}<path d="M157 106q73-35 141 0" stroke="${b.seal?'#e1f0ff':'#5d7294'}" stroke-width="${b.seal?9:3}" fill="none" ${b.seal?'':'stroke-dasharray="6 4"'}/><path d="m291 105 3 16" stroke="#466385" stroke-width="3"/><rect x="163" y="145" width="128" height="82" rx="20" fill="${b.material==='water'?'#adcff1':b.material==='reuse'?'#c8e5c7':b.material==='cloth'?'#f5d0a5':'#edf2f6'}"/><path d="M174 164h106" fill="none" stroke-width="3"/><circle cx="228" cy="196" r="13" fill="#fff8dc" stroke="#a08d54" stroke-width="2"/><path d="m226 188 2 5 6 1-5 4 1 5-5-3-4 3 1-6-4-3 6-1Z" fill="#e5b83e" stroke="none"/>
<path d="M168 80v143m119-143v143" stroke="${b.straps==='wide'?'#527eaf':'#f0d489'}" stroke-width="${b.straps==='wide'?12:5}" opacity=".75"/></g>
<g transform="translate(332 157)">${Array.from({length:b.books},(_,i)=>`<g transform="translate(${i%2?-2:2} ${-i*12})"><rect width="67" height="13" rx="3" fill="${['#ff9478','#ffd764','#82bdb1','#a89bdf','#7caee4'][i]}" stroke="#506684" stroke-width="1.7"/><path d="M9 4h50" stroke="#fff" stroke-width="3"/></g>`).join('')}</g><text x="363" y="192" text-anchor="middle" fill="#456489" font-family="Trebuchet MS,Arial" font-size="12" font-weight="bold">${b.books} libro${b.books===1?'':'s'}</text></svg><span class="bench-label">${b.material?{cloth:'Tela común',water:'Tela impermeable',reuse:'Bolsa reutilizada'}[b.material]:'Elige una tela para empezar'}</span></div>`;}
function benchResult(){const b=state.play.bag,t=b.test;if(!t)return '<p class="tiny-helper">Cambia las piezas y pulsa «¡A probar!».</p>';if(t.signature!==bagSignature())return '<p class="tiny-helper">Cambiaste algo. ¡Prueba otra vez y compara!</p>';return `<div class="bench-result" role="status"><div class="result-chip ${t.wet?'warn':''}">${t.wet?'Entró agua':'Cuadernos secos'}</div><div class="result-chip ${t.strain?'warn':''}">${t.strain?'Cuidado con la carga':'La carga va mejor'}</div></div><p class="tiny-helper">${esc(t.note)}</p>`;}
function workshop(){const b=state.play.bag;return `<h2>Que no se mojen los cuadernos.</h2><p class="one-line">Cambia piezas, añade lluvia y carga libros. ¿Qué pasa?</p><div class="workshop-grid"><div><div id="bag-preview">${bagScene()}</div><div id="bag-result">${benchResult()}</div></div><div class="workshop-controls"><div class="pieces-group"><h3 class="pieces-title">Elige la tela</h3><div class="piece-options">${[['cloth','Tela común',''],['water','Impermeable','water'],['reuse','Bolsa reutilizada','reuse']].map(([id,t,c])=>`<button class="piece" data-action="g-material" data-value="${id}" aria-pressed="${b.material===id}"><span class="swatch ${c}"></span>${t}</button>`).join('')}</div></div><div class="pieces-group"><h3 class="pieces-title">Las tiras para cargarla</h3><div class="piece-options" style="grid-template-columns:1fr 1fr"><button class="piece" data-action="g-straps" data-value="thin" aria-pressed="${b.straps==='thin'}">Tiras delgadas</button><button class="piece" data-action="g-straps" data-value="wide" aria-pressed="${b.straps==='wide'}">Tiras anchas</button></div></div><div class="pieces-group"><h3 class="pieces-title">¿Sellamos las uniones?</h3><button class="piece" style="width:100%" data-action="g-seal" aria-pressed="${b.seal}">${b.seal?'Sí, uniones selladas':'Todavía no. Toca para sellar.'}</button></div><label class="range-row"><span>Lluvia</span><input type="range" min="0" max="2" step="1" value="${b.rain}" data-game-range="rain" aria-label="Intensidad de la lluvia"><output id="rain-output">${['Nada','Suave','Fuerte'][b.rain]}</output></label><label class="range-row"><span>Libros</span><input type="range" min="1" max="5" step="1" value="${b.books}" data-game-range="books" aria-label="Cantidad de libros"><output id="books-output">${b.books} libro${b.books===1?'':'s'}</output></label><div class="test-controls"><button class="btn orange" data-action="g-test">¡A probar!</button><span>${b.tests?`${b.tests} prueba${b.tests===1?'':'s'} en tu taller`:'Puedes cambiar una pieza cada vez.'}</span></div></div></div>`;}
function kidCase(){const c=cases.find(c=>c.id===state.caseId),a=caseAnswer(),o=c.options.find(o=>o.id===a.choice),brief={lluvia:'Llueve camino al colegio. Necesitamos llevar los útiles secos y aprovechar lo que ya tenemos.',recreo:'Una llave sigue goteando. Queremos cuidar el agua y que todos puedan usarla.',biblioteca:'Hay que llevar libros entre salones. El pasillo es angosto y hay escaleras.'};const imageMap={lluvia:['bag','tree','bag'],recreo:['tap','phone','notebook'],biblioteca:['bike','bag','phone']};return `<h2>Ahora te toca decidir.</h2><p class="one-line">Elige un caso y compara sus soluciones.</p><div class="case-mini-tabs" role="group" aria-label="Casos del barrio">${cases.map(c=>`<button data-action="g-case" data-value="${c.id}" aria-pressed="${state.caseId===c.id}">${art(c.icon)}${c.tab}</button>`).join('')}</div><div class="case-comic">${art(c.icon)}<div><h3>${c.title}</h3><p>${brief[c.id]}</p></div></div><div class="solution-picks" role="group" aria-label="Soluciones posibles">${c.options.map((op,j)=>`<button class="solution-pick" data-action="g-solution" data-value="${op.id}" aria-pressed="${a.choice===op.id}">${a.choice===op.id?'<span class="selection-tick">✓</span>':''}${art(imageMap[c.id][j])}<span>${op.name}</span><p>${op.pro}</p></button>`).join('')}</div>${o?`<div class="decision-callout" role="status"><strong>Tu elección tiene un reto:</strong> ${o.trade}</div>`:''}`;}
function kidObjectPicker(){return `<div class="object-picker-inline" role="group" aria-label="Objeto de mi investigación">${Object.entries(objects).map(([id,o])=>`<button class="object-pick" data-action="pick-object" data-object="${id}" aria-pressed="${state.object===id}">${art(id==='other'?'pencil':id)}${id==='other'?'Otro objeto':o.name}</button>`).join('')}</div>${state.object==='other'?input('customObject','¿Cuál es tu objeto?',state.customObject,'',80):''}`;}
function renderNeeds(){const s=stageOf(1);if(s===0)return mission(1,workshop());if(s===1)return mission(1,kidCase());const c=cases.find(c=>c.id===state.caseId),a=caseAnswer(),o=c.options.find(op=>op.id===a.choice);return mission(1,`<h2>Una buena idea tiene una razón.</h2><p class="one-line">${o?`Elegiste: <strong>${o.name}</strong>.`:'Primero elige una solución en el paso anterior.'}</p>${field('case.why','¿Por qué le sirve a estas personas?',a.why,'Piensa en el lugar, lo que necesitan y lo que tienen.',2)}${field('case.trade','¿Qué dificultad tiene? ¿Cómo la mejorarías?',a.trade,'Una solución también puede tener límites.',2)}<details open><summary>Elige el objeto que investigarás</summary>${kidObjectPicker()}<p class="tiny-helper">Te acompañará en las siguientes misiones. Puedes elegir uno distinto al del taller.</p></details>`);}
const slotPositions=[[16,23],[50,13],[84,23],[16,77],[50,88],[84,77]];
function ownNetwork(){return `<div class="connect-map ${ui.actor!==null?'ready-drop':''} ${ui.absent>=0?'disrupted':''}"><svg class="connect-lines ${ui.tracing?'trace-links':''}" viewBox="0 0 600 355" preserveAspectRatio="none" aria-hidden="true">${state.actors.slice(0,6).map((a,i)=>`<path d="M300 177.5 L${slotPositions[i][0]*6} ${slotPositions[i][1]*3.55}" stroke="${ui.absent===i?'#b9c5d4':'#6a99c8'}" stroke-width="${ui.tracing?3.5:2.2}" ${ui.absent===i?'stroke-dasharray="7 7"':''} fill="none"/>`).join('')}</svg><div class="connect-center">${art(state.object==='other'?'pencil':state.object)}<span>${esc(objectName())}</span></div>${slotPositions.map((p,i)=>`<button class="connect-slot ${state.actors[i]?'full':''} ${ui.absent===i?'is-absent':''}" style="left:${p[0]}%;top:${p[1]}%" data-action="g-slot" data-slot="${i}" data-drop-slot="${i}" aria-label="${state.actors[i]?'Ver relación: '+esc(state.actors[i].name):'Conectar en el lugar '+(i+1)}">${state.actors[i]?esc(state.actors[i].name):ui.actor!==null?esc(objects[state.object].actors[ui.actor]?.[0]||'Tu relación'):'<span class="add-symbol">+</span>'}</button>`).join('')}</div>`;}
function actorTray(){return `<div class="actor-tray" role="group" aria-label="Participantes para conectar">${objects[state.object].actors.map((a,i)=>`<button class="actor-token" draggable="true" data-drag-actor="${i}" data-action="g-actor" data-value="${i}" aria-pressed="${ui.actor===i}">${icon(i===2?'leaf':i===3?'home':'people')}<span>${a[0]}</span></button>`).join('')}</div><p class="tiny-helper">Arrastra una pieza a un lugar vacío. También puedes tocar la pieza y después el signo +.</p>`;}
function connectionEffect(index){const a=state.actors[index];if(!a)return 'Elige una conexión de tu red para ponerla a prueba.';const name=a.name.toLowerCase();if(/repar|manten|taller/.test(name))return `Sin quien cuide o repare tu objeto, una falla puede impedir que se use. ¿Quién sentiría ese cambio?`;if(/material|tela|pieza|caucho|cierre/.test(name))return 'Sin un material o repuesto adecuado, fabricar o reparar el objeto puede ser más difícil.';if(/electric|red|suministro|tuber|agua/.test(name))return 'Al faltar este servicio, algunas funciones cambian o dejan de estar disponibles.';if(/call|norm|colegio|acuerdo/.test(name))return 'Las condiciones del lugar y los acuerdos cambian cómo y quién puede usarlo.';if(/usa|usuari|comunidad/.test(name))return 'Las personas tienen necesidades distintas. Sin escuchar a quien lo usa, el diseño podría no servirle.';return `Si falta «${a.name}», deja de estar disponible lo que aporta. Revisa tu explicación: ${a.relation}`;}
function addRelationDialog(slot){if(state.actors[slot]){const a=state.actors[slot];modal(`<h2 id="dialog-title">${esc(a.name)}</h2><p>${esc(a.relation)}</p><div class="row" style="margin-top:20px"><button class="btn" data-action="g-knockout" data-value="${slot}">¿Y si falta?</button><button class="btn secondary" data-action="g-remove-relation" data-value="${slot}">Quitar relación</button></div>`);return;}if(ui.actor===null){toast('Toca primero una pieza de abajo. Después, toca el signo +.');return;}if(state.actors.length>=6){toast('Ya hay seis conexiones. Puedes revisar o quitar una.');return;}const a=objects[state.object].actors[ui.actor];modal(`<h2 id="dialog-title">Conecta: ${a[0]}</h2><p>¿Qué hace posible para <strong>${esc(objectName())}</strong>?</p><form id="kid-relation-form"><label class="field"><span>Mi explicación</span><input id="kid-relation" maxlength="300" required autocomplete="off" placeholder="Escribe lo que aporta a tu objeto"></label><details><summary>Necesito una pista</summary><p>${a[1]}</p></details><div class="row"><button type="submit" class="btn">Conectar a mi red</button></div></form>`);}
function dilemmaSVG(){return `<svg viewBox="0 0 320 240" role="img" aria-label="Dos estudiantes comparten un computador. Uno usa el teclado y el otro espera su turno."><path d="M35 180h251M47 180v48m225-48v48" stroke="#59738d" stroke-width="6" stroke-linecap="round"/><rect x="111" y="94" width="108" height="69" rx="9" fill="#92b9e5" stroke="#3d5c82" stroke-width="3"/><path d="M153 163v15m-26 0h66" stroke="#3d5c82" stroke-width="5"/><rect x="119" y="103" width="92" height="51" rx="4" fill="#e5f5fd"/><path d="m137 130 13 10 29-24" fill="none" stroke="#6db49c" stroke-width="6" stroke-linecap="round"/><ellipse cx="73" cy="76" rx="28" ry="31" fill="#e8b68d" stroke="#3d5c82" stroke-width="2.5"/><path d="M44 69q-2-42 31-29 28 1 24 31L83 60l-8 8-13-7Z" fill="#5f5960"/><path d="M45 113h49l12 64H34Z" fill="#7da7db" stroke="#3d5c82" stroke-width="2.5"/><path d="m90 132 28 38 24-1" stroke="#e8b68d" stroke-width="13" fill="none" stroke-linecap="round"/><ellipse cx="265" cy="79" rx="26" ry="30" fill="#b88462" stroke="#3d5c82" stroke-width="2.5"/><path d="M237 73q-2-41 27-34 34-4 29 46l-11-19-34 1Z" fill="#4d4853"/><path d="M244 114h41l15 62h-73Z" fill="#ef947d" stroke="#3d5c82" stroke-width="2.5"/><path d="m243 132-17 22m51-20 12 29" stroke="#b88462" stroke-width="12" fill="none" stroke-linecap="round"/><circle cx="63" cy="78" r="2.5" fill="#3d5c82"/><circle cx="81" cy="78" r="2.5" fill="#3d5c82"/><path d="M65 91q7 6 12 0" stroke="#3d5c82" stroke-width="2" fill="none"/><circle cx="256" cy="79" r="2.5" fill="#3d5c82"/><circle cx="274" cy="79" r="2.5" fill="#3d5c82"/><path d="M258 95q6-4 12 0" stroke="#3d5c82" stroke-width="2" fill="none"/><path d="M204 42q-17-23-35 0-2 14 18 13l12 8-2-13q10-3 7-8Z" fill="white" stroke="#7e9bbb" stroke-width="2"/><text x="184" y="49" text-anchor="middle" font-size="18" font-weight="bold" fill="#4b739e">?</text></svg>`;}
function renderNetwork(){const s=stageOf(2);if(s===0)return mission(2,`<h2>Arma la red de tu objeto.</h2><p class="one-line">Tu objeto: <strong>${esc(objectName())}</strong>. Une al menos tres participantes y cuenta qué aporta cada uno.</p>${ownNetwork()}${actorTray()}<div class="row space-between"><span class="actor-count">${state.actors.length} conexiones guardadas</span><button class="mini-button" data-action="g-trace" aria-pressed="${ui.tracing}">${ui.tracing?'Detener recorrido':'Seguir las conexiones'}</button><button class="link-btn" data-action="g-own-actor">Agregar otra relación</button></div>`);if(s===1)return mission(2,`<h2>Quita una conexión. ¿Qué cambia?</h2><p class="one-line">Haz clic en una parte de tu red para imaginar que falta.</p><div class="effect-layout"><div class="effect-art ${ui.absent>=0?'is-off':''}">${art(state.object==='other'?'pencil':state.object)}<span class="effect-tag">${ui.absent>=0?'Falta: '+esc(state.actors[ui.absent]?.name||'una conexión'):'Todas las conexiones activas'}</span></div><div><div class="effect-buttons">${state.actors.map((a,i)=>`<button data-action="g-effect" data-value="${i}" aria-pressed="${ui.absent===i}">${esc(a.name)}</button>`).join('')||'<p class="tiny-helper">Primero agrega tres relaciones en el paso «Arma la red».</p>'}</div><div class="decision-callout" role="status">${esc(connectionEffect(ui.absent))}</div><button class="link-btn" data-action="g-restore">Volver a conectar todo</button></div></div>${field('networkReflection','¿Qué cambiaría y a quién le afectaría?',state.networkReflection,'Relaciona tu respuesta con la conexión que quitaste.',2)}`);if(s===2)return mission(2,`<h2>Descubre algo con otra persona.</h2><p class="one-line">La conversación ocurre en clase o con alguien que conoces.</p><div class="chat-tabs"><button class="chat-tab ${ui.chat===0?'active':''}" data-action="g-chat" data-value="0">Una pregunta</button><button class="chat-tab ${ui.chat===1?'active':''}" data-action="g-chat" data-value="1">Otra mirada</button></div>${ui.chat===0?`<div class="dialogue-comic">${buddy()}<div><h3>Pregunta y escucha.</h3><p>«¿Qué dificultad has tenido con este objeto? ¿Quién te ayuda a resolverla?»</p></div></div><div class="role-picks">${['Un compañero','Mi docente','Una persona de mi familia'].map(r=>`<button data-action="g-role" data-value="${r}" aria-pressed="${state.interviewRole===r}">${r}</button>`).join('')}</div>${input('interviewRole','Conversé con…',state.interviewRole,'Solo el rol; no hace falta el nombre.',120)}${field('interviewNote','Algo que me contó fue…',state.interviewNote,'Escribe lo que escuchaste, sin inventarlo.',2)}<div class="row"><button class="btn small secondary" data-action="g-chat" data-value="1">Escuchar otra mirada</button></div>`:`<div class="dialogue-comic">${buddy()}<div><h3>Muestren la red a otra persona.</h3><p>Pídanle que encuentre una conexión que falte o algo que se pueda explicar mejor.</p></div></div>${field('peerIdea','La otra persona me hizo pensar en…',state.peerIdea,'',2)}${field('peerChange','Cambié o mantuve mi idea porque…',state.peerChange,'Puedes mantener tu idea si explicas una buena razón.',2)}`}`);return mission(2,`<h2>¿Quién puede participar?</h2><p class="one-line">Una persona usa siempre el teclado. Otra escribe despacio y casi no participa.</p><div class="dilemma-stage"><div class="dilemma-art">${dilemmaSVG()}</div><div class="solution-grid" role="group" aria-label="Acuerdos para compartir">${[['acuerdo','Repartimos tareas y decidimos entre todos.'],['turnos','Cambiamos de turno y damos tiempo con apoyo.'],['otra','Se me ocurre otro acuerdo.']].map(([id,t])=>`<button class="solution-pick" data-action="g-dilemma" data-value="${id}" aria-pressed="${state.dilemma===id}">${t}</button>`).join('')}</div></div>${field('dilemmaWhy','¿Cómo ayuda tu acuerdo a que todos tengan voz?',state.dilemmaWhy,'Piensa en quién decide y quién puede probar.',2)}`);}
function sketchSVG(report=false){const d=state.play.drawing;const symbol=document.getElementById('o-'+(state.object==='other'?'pencil':state.object));const object=d.template&&symbol?`<g transform="translate(155 58) scale(2.4)" opacity=".55">${symbol.innerHTML}</g>`:'';return `<svg class="sketch-svg" ${report?'':'id="drawing-board"'} viewBox="0 0 600 360" role="img" aria-label="${report?'Boceto de mi mejora':'Papel de dibujo: arrastra el lápiz para dibujar una mejora'}"><rect width="600" height="360" fill="#fbfdff"/>${report?'':Array.from({length:12},(_,i)=>`<path d="M0 ${i*30}h600" stroke="#e6eef8" stroke-width="1"/>`).join('')}${object}<g ${report?'':'id="drawn-strokes"'}>${d.strokes.map(st=>`<polyline points="${st.points.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${st.color}" stroke-width="${st.width}" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}</g></svg>`;}
function drawingPanel(){return `<h2>¿Cómo mejorarías tu objeto?</h2><p class="one-line">Dibuja encima del objeto o empieza con una hoja en blanco.</p><div class="drawing-layout"><div><div class="drawing-tools" role="toolbar" aria-label="Herramientas de dibujo">${[['#285ac8','Azul'],['#d95332','Naranja'],['#2c8d73','Verde'],['#253f66','Oscuro']].map(([color,label])=>`<button class="color-button" style="--pen-color:${color}" data-action="g-pen" data-color="${color}" aria-label="Lápiz ${label.toLowerCase()}" aria-pressed="${ui.pen===color}"></button>`).join('')}<button class="mini-button" data-action="g-undo">Deshacer</button><button class="mini-button" data-action="g-template" aria-pressed="${state.play.drawing.template}">Pegar mi objeto</button><button class="mini-button" data-action="g-clear-drawing">Hoja nueva</button></div><div class="drawing-paper">${sketchSVG()}</div><p class="tiny-helper">Dibuja con el dedo o el ratón. Para escribir tu idea, usa el espacio de la derecha.</p></div><aside class="invention-card"><h3>Mi idea de mejora</h3>${art(state.object==='other'?'pencil':state.object)}${field('ficha.improvement','Le cambiaría… porque…',state.ficha.improvement,'Explica a quién ayudaría tu cambio.',3)}</aside></div>`;}
const questions=[['context','Lugar','¿Dónde y quién lo usa?','Describe una situación cercana.','home'],['need','Necesidad','¿Qué necesidad atiende?','Piensa para qué lo necesitan esas personas.','help'],['use','Uso','¿Cómo se usa y qué necesita?','Puede necesitar cuidado, materiales, energía o servicios.','book'],['benefit','Ayuda','¿A quién ayuda y cómo?','¿Ayuda de la misma manera a todo el mundo?','people'],['limit','Problema','¿Qué dificultad puede traer?','Piensa en el precio, el acceso, el ambiente o la seguridad.','leaf'],['improvement','Mejora','¿Qué mejorarías y por qué?','Recuerda tu dibujo y cuenta a quién ayudaría.','book']];
function questionPanel(){const q=questions[ui.question];return `<h2>Una tarjeta para cada hallazgo.</h2><p class="one-line">Tu pasaporte reúne las respuestas. No tienes que escribirlas todas a la vez.</p><nav class="question-tabs" aria-label="Tarjetas de mi investigación">${questions.map((x,j)=>`<button class="${ui.question===j?'active':''} ${txt(state.ficha[x[0]])?'answered':''}" data-action="g-question" data-value="${j}">${x[1]}</button>`).join('')}</nav><div class="question-card"><div class="question-art">${art(state.object==='other'?'pencil':state.object)}</div><div><h2>${q[2]}</h2>${field('ficha.'+q[0],'Esto fue lo que descubrí',state.ficha[q[0]],q[3],3)}</div></div><div class="question-next"><p>Tarjeta ${ui.question+1} de 6</p><button class="btn small secondary" data-action="g-question" data-value="${(ui.question+1)%6}">${ui.question===5?'Volver a la primera':'Siguiente tarjeta'}</button></div>`;}
function face(level){return `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="${['#e4edf8','#fff0bc','#d4eee5','#e0e9ff'][level]}" stroke="#4e6b92" stroke-width="2.5"/><circle cx="23" cy="27" r="3" fill="#3e5b80"/><circle cx="41" cy="27" r="3" fill="#3e5b80"/><path d="${['M24 42q8-5 16 0','M24 39h16','M23 38q9 10 18 0','M21 37q11 16 22 0'][level]}" fill="none" stroke="#3e5b80" stroke-width="3" stroke-linecap="round"/>${level===3?'<path d="m48 4 2 6 6 2-6 2-2 6-2-6-6-2 6-2Z" fill="#e5bd43" stroke="#b88a2e"/>':''}</svg>`;}
function selfPanel(){const i=ui.review;return `<div class="review-big"><div class="review-symbol">${icon(['leaf','help','people','leaf','book','help'][i])}</div><p class="review-count">Idea ${i+1} de 6 · Esto te ayuda a pedir apoyo.</p><h2>${rubric[i].student}</h2><div class="review-options" role="group" aria-label="Mi autoevaluación de ${rubric[i].name}">${['Necesito ayuda','Con una pista','Puedo contarlo','Lo explico con razones'].map((t,j)=>`<button class="review-option" data-action="g-self" data-value="${j}" aria-pressed="${state.self[i]===j}">${face(j)}${t}</button>`).join('')}</div><button class="btn small secondary" data-action="g-review" data-value="${(i+1)%6}">${i===5?'Volver a la primera idea':'Siguiente idea'}</button><p class="tiny-helper">${state.self.filter(v=>v!==null).length} de 6 ideas revisadas. No es una nota automática.</p></div>`;}
function renderInvestigation(){const s=stageOf(3);if(s===0)return mission(3,drawingPanel());if(s===1)return mission(3,questionPanel());if(s===2)return mission(3,`<h2>Tu idea también puede crecer.</h2><p class="one-line">Mira lo que pensabas y cuenta qué puedes explicar mejor.</p><div class="reflection-grid"><div class="before-card"><h3>Al llegar pensaba…</h3><p>${esc(state.before||'Tu primera idea está en la misión Cazaobjetos.')}</p></div><div>${field('after','Ahora pienso que la tecnología…',state.after,'Usa un ejemplo de lo que descubriste.',3)}${field('difficulty','Algo difícil fue… Me ayudó…',state.difficulty,'Puede ser una prueba, una pista o una conversación.',2)}</div></div>`);return mission(3,selfPanel());}
function gameEvidence(){const b=state.play.bag;return `${b.test?`<section class="panel"><p class="eyebrow">Prueba en el taller</p><h2>Lo que pasó con mi mochila</h2>${reportField('Configuración de la prueba',b.test.setup)}${reportField('Resultado del modelo',b.test.wet?'Entró agua.':'Los cuadernos se mantuvieron secos.')}${reportField('Carga y cuidado',b.test.strain?'La carga presentó una dificultad en el modelo.':'La carga resultó más favorable en el modelo.')}${reportField('Una pista para mejorar',b.test.note)}<p class="small muted">Modelo cualitativo para comparar decisiones; no es una medición de resistencia o impermeabilidad real.</p></section>`:''}${state.play.drawing.strokes.length||state.play.drawing.template?`<section class="panel"><p class="eyebrow">Mi mejora dibujada</p><h2>Un boceto para conversar</h2><div class="sketch-in-report">${sketchSVG(true)}</div>${reportField('La idea de mi dibujo',state.ficha.improvement)}</section>`:''}`;}
function portfolioParts(){return gameEvidence()+corePortfolioParts();}
function renderNotebook(){const done=milestones();let body='';if(ui.passport===0)body=`<section class="panel"><h2>Tu colección de descubrimientos</h2><p class="muted" style="margin-top:9px">Cada sello reúne una prueba y tus ideas. Puedes volver a mejorarlas.</p><div class="passport-stamps">${kidMissions.map((m,i)=>`<article class="stamp ${done[i]?'earned':''}">${art(m.icon)}<h3>${m.name}</h3><p>${done[i]?'¡Descubrimiento guardado!':'Todavía hay pistas por completar.'}</p><a href="#${modules[i].id}">${done[i]?'Volver a explorar':'Continuar misión'}</a></article>`).join('')}</div>${input('alias','Nombre de mi equipo o apodo',state.alias,'No hace falta escribir tu nombre completo.',60)}<div class="passport-tip" style="margin-top:20px">${done.every(Boolean)?'¡Tienes los cuatro sellos! Revisa tu trabajo y compártelo con tu profe.':'Los sellos indican que registraste las actividades. Tu profe revisará tus explicaciones contigo.'}</div></section>`;else if(ui.passport===1)body=`<section class="panel"><h2>La idea que fui construyendo</h2><div class="compare"><div><h3>Antes pensaba…</h3><p>${esc(state.before||'Escribe tu primera idea en Cazaobjetos.')}</p></div><div><h3>Ahora pienso…</h3><p>${esc(state.after||'Tu nueva idea aparecerá al terminar Mi invento.')}</p></div></div>${state.play.drawing.strokes.length||state.play.drawing.template?`<div class="sketch-in-report">${sketchSVG(true)}</div>`:''}${reportField('La mejora que propongo',state.ficha.improvement)}<details class="evidence-fold"><summary>Ver todo mi trabajo</summary><div class="portfolio-grid">${portfolioParts()}</div></details></section><section class="panel" style="margin-top:20px"><h2>Una pista de mi profe</h2>${reportField('Mi devolución',state.teacherComment)}${field('revisionPlan','Mi próximo intento será…',state.revisionPlan,'',2)}</section>`;else body=`<section class="panel"><h2>¡Llévate tus descubrimientos!</h2><div class="delivery-options"><article class="delivery-option">${icon('book')}<h3>Mi trabajo para compartir</h3><p>Descarga el portafolio y entrégalo como indique tu profe.</p><button class="btn" data-action="download-report">Descargar mi portafolio</button></article><article class="delivery-option">${icon('home')}<h3>Continuar en otro equipo</h3><p>Guarda tus respuestas y ábrelas aquí cuando quieras seguir.</p><button class="btn secondary" data-action="backup">Guardar mis respuestas</button></article></div><div class="deliver-tools"><button class="link-btn" data-action="import">Abrir respuestas guardadas</button><button class="link-btn" data-action="print">Imprimir o guardar en PDF</button><button class="link-btn" data-action="report-help">¿Cómo lo entrego?</button></div><details><summary>Voy a compartir el equipo</summary><p>Guarda primero tus respuestas. Después puedes abrir un cuaderno nuevo para otra persona.</p><button class="btn small secondary" data-action="reset">Empezar un cuaderno nuevo</button></details><p class="tiny-helper">Tus respuestas se quedan en este navegador. No se envían solas al docente.</p></section>`;return `<header class="passport-head"><div><p class="eyebrow" style="color:#f5da83;margin:0 0 9px">Mis descubrimientos</p><h1>Mi pasaporte</h1><p><span data-progress>${done.filter(Boolean).length} de 4 sellos</span> · Aquí se quedan tus ideas.</p></div>${buddy()}</header><nav class="passport-tabs" aria-label="Mi pasaporte">${['Mis sellos','Mi trabajo','Guardar y compartir'].map((t,i)=>`<button class="${ui.passport===i?'active':''}" data-action="g-passport" data-value="${i}">${t}</button>`).join('')}</nav>${body}`;}
function render(){const r=currentRoute();state.last=r;document.body.dataset.view=r;const views={inicio:renderHome,museo:renderMuseum,necesidades:renderNeeds,red:renderNetwork,ficha:renderInvestigation,cuaderno:renderNotebook,docentes:renderTeacher,fuentes:renderSources};const extra=r==='docentes'?`<section class="panel" style="margin-bottom:23px"><h2>Aprender jugando, explicar después</h2><p>Esta versión distribuye las tareas en pasos cortos: clasificar un objeto a la vez, configurar una mochila y probar condiciones, construir una red con relaciones explicadas y dibujar una mejora. Se mantienen las evidencias, el diálogo presencial y los seis criterios de la propuesta.</p><p class="small muted">El taller usa reglas cualitativas de juego (tela, sellado, tiras, lluvia y libros), sin mediciones físicas ni porcentajes reales. Se evalúan los argumentos del estudiante, no una supuesta «mochila perfecta». El boceto es un apoyo para comunicar su mejora. Los tiempos se ajustan después del pilotaje.</p></section>`:'';document.getElementById('main').innerHTML=(!storageOK?'<p class="storage-warning">Este navegador no pudo guardar automáticamente. Lleva una copia de tus respuestas desde el pasaporte.</p>':'')+extra+views[r]()+`<footer class="kid-footer"><div class="row"><a href="#docentes" data-route="docentes">Para el profe</a><a href="#fuentes" data-route="fuentes">Fuentes y créditos</a><button class="link-btn" data-action="help">¿Cómo se juega?</button></div><span>Grupo 3 · UPN, 2026 · Grado quinto</span></footer>`;document.title=(r==='inicio'?'TecnoExploradores':r==='cuaderno'?'Mi pasaporte':r==='docentes'?'Guía docente':r==='fuentes'?'Fuentes y créditos':kidMissions[modules.findIndex(m=>m.id===r)].name)+' · Tecnología en mi barrio';applyAccessibility();updateProgress();}
function help(){modal(`<h2 id="dialog-title">¡Este barrio se explora jugando!</h2><div class="dialogue-comic">${buddy()}<div><h3>Entra, prueba y cuéntalo.</h3><p>Toca un edificio del mapa. Sigue los pasos de la misión y guarda tu descubrimiento.</p></div></div><p style="margin-top:16px">En el taller cambias las piezas. En las conexiones puedes arrastrar o tocar. En Mi invento dibujas con el dedo o el ratón.</p><p class="small muted">A+ agranda el texto. Aa simplifica la vista. El pasaporte guarda tus ideas en este navegador; llévate una copia si cambias de equipo.</p><div class="row" style="margin-top:18px"><button class="btn" data-action="close-modal">¡Entendido!</button></div>`);}

function missingMission(i){if(i===0)return [!txt(state.before)&&'tu primera idea',!allClassified()&&'revisar los seis objetos',!txt(state.museumIdea)&&'tu ejemplo sin pantalla'].filter(Boolean);if(i===1){const a=caseAnswer();return [!a.choice&&'elegir una solución',!txt(a.why)&&'explicar por qué la eliges',!txt(a.trade)&&'una dificultad y cómo mejorarla'].filter(Boolean);}if(i===2)return [state.actors.length<3&&'tres relaciones explicadas',!txt(state.networkReflection)&&'qué cambia si una parte falta',(!txt(state.interviewRole)||!txt(state.interviewNote))&&'lo que escuchaste en la conversación',(!txt(state.peerIdea)||!txt(state.peerChange))&&'otra mirada sobre tu red',(!txt(state.dilemma)||!txt(state.dilemmaWhy))&&'un acuerdo de participación con razones'].filter(Boolean);return [!Object.values(state.ficha).every(txt)&&'las seis tarjetas de tu idea',(!txt(state.after)||!txt(state.difficulty))&&'tu comparación antes y ahora',!state.self.every(v=>v!==null)&&'las seis ideas de «¿Cómo voy?»',state.object==='other'&&!txt(state.customObject)&&'el nombre de tu objeto'].filter(Boolean);}
function finishMission(i){const ok=milestones()[i];if(ok){modal(`<div class="complete-copy"><div class="completion-sticker stamp-spark">${art(kidMissions[i].icon)}</div><h2 id="dialog-title">¡Un descubrimiento más!</h2><p>Tu sello de <strong>${kidMissions[i].name}</strong> ya está en el pasaporte. Tu profe revisará las ideas contigo.</p><div class="row" style="justify-content:center;margin-top:22px"><button class="btn" data-action="g-next-mission" data-index="${i}">${i===3?'Ver mi pasaporte':'Explorar otra misión'}</button><button class="btn secondary" data-action="close-modal">Seguir probando</button></div></div>`);}else modal(`<h2 id="dialog-title">¡Aún quedan pistas!</h2><p>Ya se guardó tu avance. Para reunir el sello, completa:</p><ul>${missingMission(i).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="row" style="margin-top:20px"><button class="btn" data-action="close-modal">Volver a mi misión</button><button class="btn secondary" data-action="g-next-mission" data-index="${i}">Explorar y regresar luego</button></div>`);}
function testBag(){const b=state.play.bag;if(!b.material){toast('Elige primero una tela para tu mochila.');return;}const wet=b.rain>0&&(b.material==='cloth'||b.rain===2&&!b.seal);const strain=b.books>=4&&(b.straps==='thin'||b.material==='reuse');let note=wet?'Prueba otra tela o sella las uniones. Cambia una cosa y compara.':strain?'La tela resistió el agua. Ahora prueba menos libros o tiras anchas.':'¡Observa! Cambia la lluvia o la carga: ¿la misma mochila sigue funcionando igual?';if(b.rain===0)note='Sin lluvia, esta prueba no permite comparar cómo entra el agua. ¡Añade un aguacero!';b.tests++;b.test={signature:bagSignature(),wet,strain,note,setup:`${{cloth:'Tela común',water:'Tela impermeable',reuse:'Bolsa reutilizada'}[b.material]}; tiras ${b.straps==='wide'?'anchas':'delgadas'}; uniones ${b.seal?'selladas':'sin sellar'}; lluvia ${['ausente','suave','fuerte'][b.rain]}; ${b.books} libro${b.books===1?'':'s'}.`};ui.testing=true;persist();render();setTimeout(()=>{ui.testing=false;document.querySelector('.bench-scene')?.classList.remove('rain-running');},1800);}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.gameRange){const k=el.dataset.gameRange;state.play.bag[k]=Number(el.value);persist();document.getElementById(k+'-output').textContent=k==='rain'?['Nada','Suave','Fuerte'][el.value]:el.value+' libro'+(el.value==='1'?'':'s');document.getElementById('bag-preview').innerHTML=bagScene();document.getElementById('bag-result').innerHTML=benchResult();}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||!b.dataset.action.startsWith('g-'))return;e.preventDefault();const a=b.dataset.action,v=b.dataset.value,i=Number(b.dataset.index);if(a==='g-map')go(modules[i].id);else if(a==='g-stage')setStage(i,Number(b.dataset.step));else if(a==='g-finish')finishMission(i);else if(a==='g-next-mission'){closeModal();if(i===3){ui.passport=0;go('cuaderno');}else go(modules[i+1].id);}else if(a==='g-before'){state.before=v;persist();refreshGame(`[data-action="g-before"][data-value="${v}"]`);}else if(a==='g-hunt-card'){ui.hunt=Number(b.dataset.card);ui.clue=false;ui.zoom=false;refreshGame();}else if(a==='g-hunt-next'){ui.hunt=(ui.hunt+1)%museum.length;ui.clue=false;ui.zoom=false;refreshGame();}else if(a==='g-zoom'){ui.zoom=!ui.zoom;refreshGame('[data-action="g-zoom"]');}else if(a==='g-clue'){ui.clue=!ui.clue;refreshGame('[data-action="g-clue"]');}else if(a==='g-classify'){state.museum[museum[ui.hunt].id]=v;persist();refreshGame(`[data-action="g-classify"][data-value="${v}"]`);}else if(a==='g-example'){state.play.example=v;persist();refreshGame();}else if(a==='g-material'){state.play.bag.material=v;persist();refreshGame(`[data-action="g-material"][data-value="${v}"]`);}else if(a==='g-straps'){state.play.bag.straps=v;persist();refreshGame(`[data-action="g-straps"][data-value="${v}"]`);}else if(a==='g-seal'){state.play.bag.seal=!state.play.bag.seal;persist();refreshGame('[data-action="g-seal"]');}else if(a==='g-test')testBag();else if(a==='g-case'){state.caseId=v;persist();refreshGame();}else if(a==='g-solution'){if(!state.caseAnswers[state.caseId])state.caseAnswers[state.caseId]={choice:'',why:'',trade:''};state.caseAnswers[state.caseId].choice=v;persist();refreshGame(`[data-action="g-solution"][data-value="${v}"]`);}else if(a==='g-actor'){ui.actor=Number(v);refreshGame(`[data-action="g-actor"][data-value="${v}"]`);toast('Ahora toca un signo + de la red.');}else if(a==='g-slot')addRelationDialog(Number(b.dataset.slot));else if(a==='g-remove-relation'){state.actors.splice(Number(v),1);ui.absent=-1;persist();closeModal();render();}else if(a==='g-knockout'){ui.absent=Number(v);closeModal();setStage(2,1);}else if(a==='g-effect'){ui.absent=Number(v);refreshGame(`[data-action="g-effect"][data-value="${v}"]`);}else if(a==='g-restore'){ui.absent=-1;refreshGame();}else if(a==='g-trace'){ui.tracing=!ui.tracing;refreshGame('[data-action="g-trace"]');}else if(a==='g-own-actor'){ui.actor=null;modal(`<h2 id="dialog-title">Una conexión que tú encontraste</h2><form id="kid-custom-relation-form"><label class="field"><span>Persona, material o servicio</span><input id="kid-custom-name" maxlength="60" required></label><label class="field"><span>¿Qué hace posible para tu objeto?</span><input id="kid-custom-relation" maxlength="300" required></label><div class="row"><button class="btn" type="submit">Conectar</button></div></form>`);}else if(a==='g-chat'){ui.chat=Number(v);refreshGame();}else if(a==='g-role'){state.interviewRole=v;persist();refreshGame();}else if(a==='g-dilemma'){state.dilemma=v;persist();refreshGame(`[data-action="g-dilemma"][data-value="${v}"]`);}else if(a==='g-question'){ui.question=Number(v);refreshGame();}else if(a==='g-review'){ui.review=Number(v);refreshGame();}else if(a==='g-self'){state.self[ui.review]=Number(v);persist();refreshGame(`[data-action="g-self"][data-value="${v}"]`);}else if(a==='g-passport'){ui.passport=Number(v);refreshGame();}else if(a==='g-pen'){ui.pen=b.dataset.color;document.querySelectorAll('.color-button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.color===ui.pen)));}else if(a==='g-template'){state.play.drawing.template=!state.play.drawing.template;persist();refreshGame();}else if(a==='g-undo'){state.play.drawing.strokes.pop();persist();refreshGame();}else if(a==='g-clear-drawing'){if(state.play.drawing.strokes.length)modal(`<h2 id="dialog-title">¿Una hoja nueva?</h2><p>Se borrarán los trazos de este dibujo. Tu explicación seguirá guardada.</p><div class="row" style="margin-top:18px"><button class="btn" data-action="g-confirm-clear">Empezar otro dibujo</button><button class="btn secondary" data-action="close-modal">Conservar este</button></div>`);else{state.play.drawing.template=false;persist();refreshGame();}}else if(a==='g-confirm-clear'){state.play.drawing.strokes=[];state.play.drawing.template=false;persist();closeModal();refreshGame();}});
document.addEventListener('submit',e=>{if(e.target.id==='kid-relation-form'){e.preventDefault();const text=document.getElementById('kid-relation').value.trim();if(!text||ui.actor===null)return;if(state.actors.length>=6){toast('Ya tienes seis relaciones.');return;}state.actors.push({name:objects[state.object].actors[ui.actor][0],relation:text});ui.actor=null;persist();closeModal();render();toast('¡Conexión guardada!');}else if(e.target.id==='kid-custom-relation-form'){e.preventDefault();const name=document.getElementById('kid-custom-name').value.trim(),relation=document.getElementById('kid-custom-relation').value.trim();if(!name||!relation)return;if(state.actors.length>=6){toast('Ya tienes seis relaciones. Revisa una antes de agregar otra.');return;}state.actors.push({name,relation});persist();closeModal();render();}});

let activeStroke=null,activePointer=null;
function drawingPoint(e,svg){const r=svg.getBoundingClientRect();return [Math.round(Math.min(600,Math.max(0,(e.clientX-r.left)/r.width*600))),Math.round(Math.min(360,Math.max(0,(e.clientY-r.top)/r.height*360)))];}
document.addEventListener('pointerdown',e=>{const svg=e.target.closest('#drawing-board');if(!svg||e.button!==0)return;e.preventDefault();if(state.play.drawing.strokes.length>=160){toast('Tu dibujo tiene muchos trazos. Deshaz alguno para seguir.');return;}activePointer=e.pointerId;activeStroke={color:ui.pen,width:4,points:[drawingPoint(e,svg)]};state.play.drawing.strokes.push(activeStroke);const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('fill','none');line.setAttribute('stroke',ui.pen);line.setAttribute('stroke-width','4');line.setAttribute('stroke-linecap','round');line.setAttribute('stroke-linejoin','round');line.setAttribute('id','active-drawing-line');const p=activeStroke.points[0];line.setAttribute('points',p.join(',')+' '+p.join(','));document.getElementById('drawn-strokes').append(line);svg.setPointerCapture(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!activeStroke||e.pointerId!==activePointer)return;const svg=document.getElementById('drawing-board');if(!svg)return;e.preventDefault();const p=drawingPoint(e,svg),prev=activeStroke.points[activeStroke.points.length-1];if(Math.abs(p[0]-prev[0])+Math.abs(p[1]-prev[1])<3||activeStroke.points.length>=250)return;activeStroke.points.push(p);document.getElementById('active-drawing-line')?.setAttribute('points',activeStroke.points.map(p=>p.join(',')).join(' '));});
function finishStroke(e){if(!activeStroke||e.pointerId!==activePointer)return;document.getElementById('active-drawing-line')?.removeAttribute('id');activeStroke=null;activePointer=null;persist();}
